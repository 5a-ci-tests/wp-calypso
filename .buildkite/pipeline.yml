# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Installs every workspace dependency declared in the root lockfile.

env:
  BUILDKITE_AGENT_CACHE_STORE_URL: "s3://buildkite-cache-forno/wp-calypso?region=us-east-1"

steps:
  - label: ":yarn: Install dependencies"
    key: install-dependencies
    agents:
      queue: kubernetes
    image: node:24.15.0
    command: .buildkite/commands/install-dependencies.sh
